  <body>
    <!-- Content -->

    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <!-- Register Card -->
          <div class="card px-sm-6 px-0">
          
            <div class="card-body">
            <link rel="icon" type="image/x-icon" href="../assets/img/satisfyre/satisfyre-removebg-preview.png" />
            <center><span class="app-brand-text demo text-heading fw-bold">Satisfyre</span>  </center>

              <center><p class="mb-6">Make your app management easy and fun!</p></center>
               <form id="formAuthentication" class="mb-6 mx-auto" style="max-width: 600px;">
    <h4 class="mb-4 text-center">Sign Up</h4>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <div class="input-group input-group-merge">
        <input
          type="password"
          id="password"
          class="form-control"
          name="password"
          placeholder="************"
          required />
        <span class="input-group-text cursor-pointer"><i class="icon-base bx bx-hide"></i></span>
      </div>
    </div>

    <div class="mb-3">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName" name="firstName" required />
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName" name="lastName" required />
    </div>

    <div class="mb-3">
      <label for="phoneNumber" class="form-label">Phone Number</label>
      <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="+2348012345678" required />
    </div>

    <!-- <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" id="role" name="role" required>

      <!-- </select>

    <!-- <div class="mb-3">

    </div> -->

    <div class="mb-3">
      <label for="referredBy" class="form-label">Referred By</label>
      <input type="text" class="form-control" id="referredBy" name="referredBy" />
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="terms-conditions" name="terms" required />
      <label class="form-check-label" for="terms-conditions">
        I agree to
        <a href="#">privacy policy & terms</a>
      </label>
    </div>

    <button type="submit" class="btn btn-primary w-100">Sign up</button>

    <p id="message" class="mt-3 text-center fw-bold"></p>
  </form>

              <p class="text-center">
